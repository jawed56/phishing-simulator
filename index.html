<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Trap Simulator — Détecteur de Pièges Numériques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #060913;
            --bg-card: rgba(13, 20, 38, 0.75);
            --bg-card-border: rgba(255, 255, 255, 0.08);
            --accent-primary: #ec4899;
            --accent-secondary: #8b5cf6;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.25s ease-in-out;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--text-main);
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.16) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(6, 182, 212, 0.05) 0px, transparent 60%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 24px;
            padding: 2.5rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 30%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Barre de statut et de progression */
        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.6rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 99px;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-secondary), var(--accent-primary));
            transition: width 0.35s ease;
        }

        /* Carte de Scénario */
        .scenario-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--bg-card-border);
            border-radius: 18px;
            padding: 1.6rem;
            margin-bottom: 1.5rem;
        }

        .scenario-badge {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 5px 12px;
            border-radius: 6px;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            margin-bottom: 1rem;
        }

        .scenario-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            color: #ffffff;
        }

        .scenario-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.55;
        }

        /* Fenêtre de rendu technique (Terminal / Mock) */
        .mock-window {
            background: #080c16;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 1.2rem;
            font-family: var(--font-mono);
            font-size: 0.88rem;
        }

        .mock-header {
            background: #0f172a;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .mock-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .mock-context-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-left: 6px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .mock-body {
            padding: 1.25rem;
    color: #cbd5e1;
    line-height: 1.65;
    word-break: normal;
    overflow-wrap: anywhere;
        }

        .mock-body span.label {
            color: #64748b;
        }

        .mock-body .param-val {
            color: #38bdf8;
        }

        /* Outil d'inspection interactif */
        .inspect-tool {
            margin-top: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-hint {
            background: transparent;
            border: 1px dashed rgba(245, 158, 11, 0.4);
            color: #fcd34d;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-hint:hover {
            background: rgba(245, 158, 11, 0.1);
            border-color: #f59e0b;
        }

        .hint-text {
            display: none;
            margin-top: 0.6rem;
            padding: 0.75rem 1rem;
            background: rgba(245, 158, 11, 0.08);
            border-left: 3px solid #f59e0b;
            border-radius: 4px;
            font-size: 0.82rem;
            color: #fde68a;
        }

        /* Grille des boutons de décision */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 1.5rem;
        }

        .btn-choice {
            padding: 1.05rem;
            border-radius: 14px;
            border: 1px solid var(--bg-card-border);
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.02);
        }

        .btn-choice:active { transform: scale(0.98); }

        .btn-safe {
            background: rgba(16, 185, 129, 0.08);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .btn-safe:hover {
            background: var(--accent-green);
            color: #060913;
            border-color: var(--accent-green);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .btn-trap {
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.25);
        }
        .btn-trap:hover {
            background: var(--accent-red);
            color: white;
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        /* Panneau de feedback pédagogique */
        .feedback-box {
            display: none;
            padding: 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback-correct {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            color: #a7f3d0;
        }

        .feedback-wrong {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fecaca;
        }

        .feedback-box h4 {
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feedback-box p {
            font-size: 0.92rem;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .ioc-list {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.82rem;
            font-family: var(--font-mono);
            color: #fcd34d;
        }

        .btn-next {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--accent-secondary), var(--accent-primary));
            border: none;
            border-radius: 12px;
            color: white;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: var(--transition);
        }
        .btn-next:hover { opacity: 0.92; box-shadow: 0 0 20px rgba(139, 92, 246, 0.35); }

        /* Écran de Bilan & Statistiques */
        .result-screen {
            display: none;
            text-align: center;
            padding: 1rem 0;
        }

        .result-score {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0.8rem 0;
            letter-spacing: -0.03em;
        }

        .score-summary-table {
            width: 100%;
            margin: 1.5rem 0;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
        }

        .score-summary-table th, .score-summary-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .score-summary-table th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.05em;
        }

        .tag-correct { color: var(--accent-green); font-weight: bold; }
        .tag-wrong { color: var(--accent-red); font-weight: bold; }

        .btn-restart {
            padding: 13px 32px;
            background: #1e293b;
            color: white;
            border: 1px solid var(--bg-card-border);
            border-radius: 12px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-restart:hover {
            background: var(--text-main);
            color: var(--bg-main);
        }

        @media (max-width: 640px) {
            .container { padding: 1.5rem; }
            .actions-grid { grid-template-columns: 1fr; }
            header h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Simulateur de Pièges Numériques</h1>
            <p>Testez vos réflexes face aux ruses d'ingénierie sociale et d'attaques modernes.</p>
        </header>

        <div class="status-row">
            <span>Évaluation en cours</span>
            <span id="step-counter">Scénario 1 / 8</span>
        </div>

        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <!-- Zone d'évaluation active -->
        <div id="quiz-area">
            <div class="scenario-card">
                <span class="scenario-badge" id="scenario-category">Vecteur d'attaque</span>
                <h3 class="scenario-title" id="scenario-title">Chargement...</h3>
                <p class="scenario-desc" id="scenario-desc"></p>

                <div class="mock-window">
                    <div class="mock-header">
                        <div class="mock-dot" style="background:#ef4444;"></div>
                        <div class="mock-dot" style="background:#f59e0b;"></div>
                        <div class="mock-dot" style="background:#10b981;"></div>
                        <span class="mock-context-label" id="mock-context">Aperçu technique</span>
                    </div>
                    <div class="mock-body" id="mock-content"></div>
                </div>

                <div class="inspect-tool">
                    <button type="button" class="btn-hint" onclick="toggleHint()">🔍 Examiner l'indice technique</button>
                </div>
                <div class="hint-text" id="hint-text"></div>
            </div>

            <div class="actions-grid" id="actions-grid">
                <button class="btn-choice btn-safe" onclick="checkAnswer(false)">
                    🛡️ Fichier / Lien Légitime
                </button>
                <button class="btn-choice btn-trap" onclick="checkAnswer(true)">
                    ⚠️ Piège Détecté (Attaque)
                </button>
            </div>

            <div class="feedback-box" id="feedback-box">
                <h4 id="feedback-title">Analyse</h4>
                <p id="feedback-text"></p>
                <div class="ioc-list" id="feedback-ioc"></div>
                <button class="btn-next" onclick="nextScenario()">Scénario suivant →</button>
            </div>
        </div>

        <!-- Écran de bilan final -->
        <div class="result-screen" id="result-screen">
            <h2>Bilan de Cyber-Vigilance</h2>
            <div class="result-score" id="final-score">0/8</div>
            <p id="final-verdict" style="color: var(--text-muted); max-width: 540px; margin: 0 auto; line-height: 1.6;"></p>

            <table class="score-summary-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Scénario & Vecteur</th>
                        <th>Nature</th>
                        <th>Résultat</th>
                    </tr>
                </thead>
                <tbody id="summary-tbody"></tbody>
            </table>

            <button class="btn-restart" onclick="restartQuiz()">Recommencer l'évaluation ↺</button>
        </div>
    </div>

    <script>
        const scenarios = [
            {
                category: "Quishing & Espace Public",
                title: "Paiement de stationnement sur borne urbaine",
                desc: "Vous approchez d'un parcmètre. Un QR Code est affiché avec la mention 'Paiement sans contact rapide'. En passant votre doigt, vous sentez une légère surépaisseur.",
                context: "Aperçu de la caméra smartphone",
                mock: `<span class="label">URL détectée :</span> https://stationnement-rapide-paiement.net/session?id=892<br>
                       <span class="label">Signalétique physique :</span> Le bord d'un autocollant dépasse de la plaque en aluminium.`,
                hint: "Inspectez le nom de domaine : est-il géré par la régie municipale ou est-ce un domaine générique en .net récemment enregistré ?",
                isTrap: true,
                ioc: "Indicateur : Domaine pirate (.net générique) + altération matérielle physique (sticker superposé).",
                explanation: "C'est un cas typique de Quishing physique. L'attaquant colle son propre QR Code par-dessus la signalétique officielle pour rediriger les automobilistes vers un faux terminal de paiement bancaire."
            },
            {
                category: "Leurre de Fichier & Faux Suffixe",
                title: "Réception de pièces jointes pour une réunion",
                desc: "Un collaborateur vous envoie les enregistrements du séminaire dans une archive zip.",
                context: "Explorateur de fichiers Windows",
                mock: `<span class="label">Nom du fichier :</span> synthese-reunion-annuelle.mp4.exe<br>
                       <span class="label">Type affiché dans l'explorateur :</span> Application<br>
                       <span class="label">Icône affichée :</span> Lecteur multimédia VLC`,
                hint: "Regardez l'extension finale à l'extrême droite du nom : quelle est l'extension réelle prise en compte par le système d'exploitation ?",
                isTrap: true,
                ioc: "Indicateur : Double extension (.mp4.exe) et type 'Application'.",
                explanation: "C'est la ruse de la double extension. L'extension réelle est '.exe' (un binaire exécutable malveillant) masquée visuellement par un faux suffixe vidéo pour tromper l'utilisateur."
            },
            {
                category: "Notification Cloud Légitime",
                title: "Alerte de modification de document collaboratif",
                desc: "Vous recevez une notification indiquant qu'un document de travail a été mis à jour par votre responsable.",
                context: "En-tête de message & Lien sécurisé",
                mock: `<span class="label">Expéditeur :</span> no-reply@sharepointonline.com<br>
                       <span class="label">Lien cible :</span> https://votre-organisation.sharepoint.com/sites/Direction/Docs<br>
                       <span class="label">Certificat TLS :</span> Valide (Émis pour Microsoft Corporation)`,
                hint: "Vérifiez que le domaine de destination racine se termine strictement par 'sharepoint.com' sans tirets ni sous-domaines suspects.",
                isTrap: false,
                ioc: "Indicateur : Domaine authentique Microsoft SharePoint + émetteur officiel.",
                explanation: "Le domaine cible et le certificat correspondent rigoureusement à l'infrastructure officielle de l'entreprise, sans domaine intermédiaire suspect ni redirection masquée."
            },
            {
                category: "Ingénierie Sociale & Urgence",
                title: "Alerte de sécurité de la messagerie interne",
                desc: "Un e-mail urgent vous demande de renouveler votre mot de passe sous peine de suspension de votre boîte dans les 2 heures.",
                context: "Client de messagerie d'entreprise",
                mock: `<span class="label">De :</span> Support IT &lt;support-securite@entreprise-validation-portail.com&gt;<br>
                       <span class="label">Objet :</span> URGENT : Désactivation imminente de votre compte<br>
                       <span class="label">Action requise :</span> Cliquez sur le portail de réinitialisation d'urgence`,
                hint: "Analysez le sentiment d'urgence et le nom de domaine de l'adresse de messagerie d'expédition.",
                isTrap: true,
                ioc: "Indicateur : Domaine externe non affilié + sentiment d'urgence anxiogène.",
                explanation: "L'urgence artificielle combinée à un nom de domaine externe trompeur ('entreprise-validation-portail.com') est la signature classique d'une tentative d'hameçonnage visant la capture d'identifiants."
            },
            {
                category: "Élévation de Privilèges",
                title: "Ouverture d'une image transmise par clé USB",
                desc: "Vous double-cliquez sur une photo de vacances transmise sur une clé USB trouvée en salle de réunion.",
                context: "Contrôle de compte d'utilisateur (UAC Windows)",
                mock: `<span class="label">Invite UAC :</span> 'Voulez-vous autoriser cette application à apporter des modifications à votre appareil ?'<br>
                       <span class="label">Programme :</span> photos_ete_2026.jpg.scr<br>
                       <span class="label">Éditeur :</span> Inconnu`,
                hint: "Une visionneuse d'image native a-t-elle besoin de modifier les fichiers système de votre machine ?",
                isTrap: true,
                ioc: "Indicateur : Extension d'économiseur d'écran binaire (.scr) + demande de privilèges d'administration.",
                explanation: "Une image réelle ne déclenche jamais d'invite UAC. L'extension '.scr' est un format exécutable Windows classique exploité pour déployer un cheval de Troie avec de hauts privilèges."
            },
            {
                category: "Fatigue MFA & Bombardement Push",
                title: "Notification d'authentification multifacteur répétée",
                desc: "Il est 23h30. Votre smartphone reçoit 12 notifications consécutives vous demandant d'approuver une connexion à Paris, suivie d'un appel prétendant être le support IT.",
                context: "Application Microsoft Authenticator / Okta Verify",
                mock: `<span class="label">Demande de connexion :</span> Portail VPN Entreprise (Localisation : Paris, IP : 185.220.101.5)<br>
                       <span class="label">Statut :</span> 12 demandes en attente de validation par bouton 'Approuver'`,
                hint: "Si vous n'êtes pas vous-même en train de vous connecter, que cherche à provoquer la répétition des notifications ?",
                isTrap: true,
                ioc: "Indicateur : Attaque par fatigue MFA (Push Bombing) pour forcer une validation par lassitude.",
                explanation: "C'est une attaque par 'MFA Fatigue'. L'attaquant possède déjà votre mot de passe et spamme vos notifications push en espérant que vous cliquiez sur 'Approuver' par erreur ou pour faire cesser les alertes."
            },
            {
                category: "Consentement Cloud OAuth 365",
                title: "Demande d'autorisation pour un outil de productivité",
                desc: "Un lien vous propose d'intégrer une application 'PDF Reader Online' à votre compte Microsoft 365 professionnel.",
                context: "Boîte de dialogue des autorisations d'application Microsoft",
                mock: `<span class="label">Permissions demandées :</span> 'Lire tous vos e-mails', 'Envoyer des messages en votre nom', 'Accéder à vos fichiers OneDrive en permanence'<br>
                       <span class="label">Éditeur :</span> Non vérifié (ID de locataire externe)`,
                hint: "Un simple lecteur PDF a-t-il légitimement besoin d'un accès complet à l'envoi d'e-mails et aux boîtes de réception ?",
                isTrap: true,
                ioc: "Indicateur : Permissions OAuth excessives (Mail.ReadWrite, Files.ReadWrite.All) par un éditeur non vérifié.",
                explanation: "C'est une attaque par consentement illégitime (Illicit Consent Grant). Une fois acceptée, l'application pirate accède à vos courriels et fichiers cloud sans jamais avoir besoin de connaître votre mot de passe."
            },
            {
                category: "Smishing & Faux Suivi de Colis",
                title: "SMS d'affranchissement d'un transporteur",
                desc: "Vous recevez un SMS mentionnant la retenue d'un colis pour frais de douane manquants de 1,95 €.",
                context: "Application SMS Smartphone",
                mock: `<span class="label">Message :</span> 'Info Colis : Votre livraison #FR8923 est suspendue. Régularisez vos frais sur : http://chronopost-douane-suivi.info/taxe'<br>
                       <span class="label">Expéditeur :</span> +33 6 44 92 10 33`,
                hint: "Un transporteur officiel utilise-t-il des numéros mobiles personnels (06/07) et un nom de domaine non officiel en .info ?",
                isTrap: true,
                ioc: "Indicateur : Domaine d'hameçonnage (.info) + émission via un numéro mobile individuel.",
                explanation: "Ce cas de Smishing classique exploite l'attente d'achats en ligne. Le lien mène vers une page de hameçonnage de carte bancaire doublée d'un abonnement mensuel caché."
            }
        ];

        let currentIndex = 0;
        let score = 0;
        let userHistory = [];

        function loadScenario() {
            const current = scenarios[currentIndex];
            document.getElementById('step-counter').textContent = `Scénario ${currentIndex + 1} / ${scenarios.length}`;
            document.getElementById('scenario-category').textContent = current.category;
            document.getElementById('scenario-title').textContent = current.title;
            document.getElementById('scenario-desc').textContent = current.desc;
            document.getElementById('mock-context').textContent = current.context;
            document.getElementById('mock-content').innerHTML = current.mock;
            
            document.getElementById('hint-text').style.display = 'none';
            document.getElementById('hint-text').textContent = current.hint;

            document.getElementById('progress-bar').style.width = `${((currentIndex) / scenarios.length) * 100}%`;
            document.getElementById('feedback-box').style.display = 'none';
            document.getElementById('actions-grid').style.display = 'grid';
        }

        function toggleHint() {
            const hint = document.getElementById('hint-text');
            hint.style.display = (hint.style.display === 'block') ? 'none' : 'block';
        }

        function checkAnswer(userThinksTrap) {
            const current = scenarios[currentIndex];
            const isCorrect = (userThinksTrap === current.isTrap);
            
            userHistory.push({
                title: current.title,
                category: current.category,
                isTrap: current.isTrap,
                userCorrect: isCorrect
            });

            const feedbackBox = document.getElementById('feedback-box');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const feedbackIoc = document.getElementById('feedback-ioc');

            if (isCorrect) {
                score++;
                feedbackBox.className = "feedback-box feedback-correct";
                feedbackTitle.innerHTML = "✅ Diagnostic Correct !";
            } else {
                feedbackBox.className = "feedback-box feedback-wrong";
                feedbackTitle.innerHTML = "❌ Piège non déjoué";
            }

            feedbackText.textContent = current.explanation;
            feedbackIoc.textContent = current.ioc;
            feedbackBox.style.display = 'block';
            document.getElementById('actions-grid').style.display = 'none';
        }

        function nextScenario() {
            currentIndex++;
            if (currentIndex < scenarios.length) {
                loadScenario();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-area').style.display = 'none';
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('step-counter').textContent = "Terminé";
            
            const resultScreen = document.getElementById('result-screen');
            resultScreen.style.display = 'block';

            document.getElementById('final-score').textContent = `${score}/${scenarios.length}`;
            const verdict = document.getElementById('final-verdict');
            const tbody = document.getElementById('summary-tbody');
            tbody.innerHTML = '';

            userHistory.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color: var(--text-muted); font-family: var(--font-mono);">${index + 1}</td>
                    <td><strong>${item.title}</strong><br><span style="font-size:0.75rem; color:var(--text-muted);">${item.category}</span></td>
                    <td>${item.isTrap ? '<span style="color:#fca5a5;">Attaque</span>' : '<span style="color:#86efac;">Légitime</span>'}</td>
                    <td>${item.userCorrect ? '<span class="tag-correct">Déjoué (+1)</span>' : '<span class="tag-wrong">Piégé (0)</span>'}</td>
                `;
                tbody.appendChild(tr);
            });

            if (score === scenarios.length) {
                verdict.textContent = "Niveau Expert (Analyste Vigilant) : Votre réflexe d'inspection technique est impeccable. Les pièges matériels, OAuth et attaques MFA n'ont pas réussi à vous tromper.";
            } else if (score >= 5) {
                verdict.textContent = "Bonne posture globale de sécurité : Vous maîtrisez la majorité des vecteurs, mais maintenez votre vigilance face aux attaques par contournement de contexte (Quishing, OAuth, MFA Push).";
            } else {
                verdict.textContent = "Sensibilisation requise : Les attaquants s'appuient sur l'urgence et les raccourcis visuels. Prenez toujours le temps de vérifier la racine des noms de domaine et la légitimité des invites système.";
            }
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            userHistory = [];
            document.getElementById('result-screen').style.display = 'none';
            document.getElementById('quiz-area').style.display = 'block';
            loadScenario();
        }

        window.onload = loadScenario;
    </script>
</body>
</html>
